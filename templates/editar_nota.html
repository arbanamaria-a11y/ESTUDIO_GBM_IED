<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Nota</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <header class="header-centro">

        <img src="{{ url_for('static', filename='IMAGENES/escudooo.png') }}"
             alt="Logo Colegio"
             class="logo-centro">

        <h1 class="titulo-centro">
            EDITAR NOTA
        </h1>

    </header>

    <main>

        <h2>Modificar Nota</h2>

        <form method="POST">

            <label for="asignatura">Asignatura:</label>

            <input type="text"
                   id="asignatura"
                   name="asignatura"
                   value="{{ nota[2] }}"
                   required>


            <label for="nota">Nota:</label>

            <input type="number"
                   id="nota"
                   name="nota"
                   min="0"
                   max="5"
                   step="0.1"
                   value="{{ nota[3] }}"
                   required>


            <label for="fecha">Fecha:</label>

            <input type="date"
                   id="fecha"
                   name="fecha"
                   value="{{ nota[4] }}"
                   required>


            <button type="submit">
                Guardar cambios
            </button>

        </form>

        <br>

        <a href="{{ url_for('notas') }}">
            Volver a Gestionar Notas
        </a>

    </main>

<br>

</body>
</html>
